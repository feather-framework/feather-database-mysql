services:
    mariadb:
        build:
            context: .
            dockerfile: docker/mariadb/Dockerfile
        volumes:
            - 'mariadb:/var/lib/mysql'
        ports:
            - '3306:3306'
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: mariadb
            MYSQL_USER: mariadb
            MYSQL_PASSWORD: mariadb
            MYSQL_DATABASE: mariadb
        healthcheck:
            test:
                - CMD-SHELL
                - mariadb-admin --protocol=tcp --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD} ping --silent
            interval: 2s
            timeout: 5s
            retries: 30
            start_period: 20s

    test:
        build:
            context: .
            dockerfile: docker/tests/Dockerfile
        depends_on:
            mariadb:
                condition: service_healthy
        environment:
            MYSQL_HOST: mariadb
            MYSQL_PORT: 3306
            MYSQL_ROOT_PASSWORD: mariadb
            MYSQL_USER: mariadb
            MYSQL_PASSWORD: mariadb
            MYSQL_DATABASE: mariadb
            MYSQL_CA_CERT_PATH: /app/docker/mariadb/certificates/ca.pem
        volumes:
            - .:/app
        working_dir: /app
        command: ["swift", "test", "--parallel", "--enable-code-coverage"]

volumes:
    mariadb:
